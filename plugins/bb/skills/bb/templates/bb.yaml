# This repository's bb setup is maintained by the bb agent
# (Claude Code plugin bb@private-plugins). To change it, ask that agent: where the
# bb server runs, the Manager preset, periodic tasks. bb itself holds the rest
# of the setup; this file keeps only what bb cannot tell.
maintained_by: bb@private-plugins

server:
  machine: <name>      # the machine that runs the bb server, as `bb machine list` names it
  where: local         # local: this computer; remote: another machine
  route: direct        # direct, ssh-tunnel or tailscale: how the bb CLI here reaches the server
  ssh_host: null       # ssh-tunnel only: the host to tunnel to, such as a ~/.ssh/config alias that carries its key
  tunnel: null         # ssh-tunnel only: what keeps the tunnel up, such as the launch agent local.bb-server-tunnel
  url: http://127.0.0.1:38886   # BB_SERVER_URL for the bb CLI here
  cli_data_dir: null   # BB_DATA_DIR for the bb CLI here: an empty folder once the server moved away from this computer

project: <proj_…>      # the bb project of this repository
tracker: <PREFIX>      # its bb Tasks project
preset: Manager        # the delegation preset that starts a ticket's manager
